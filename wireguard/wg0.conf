# WireGuard Server-Konfiguration für den Raspberry Pi
# Tutorial: https://raspberry.tips/raspberrypi-tutorials/wireguard-vpn-server-auf-dem-raspberry-pi-einrichten

[Interface]
# Server Private Key (generieren mit: wg genkey | tee server_private.key | wg pubkey > server_public.key)
PrivateKey = SERVER_PRIVATE_KEY_HIER_EINTRAGEN
# VPN-Tunnel-IP des Servers
Address = 10.0.0.1/24
# WireGuard Port (UDP) – im Router weiterleiten
ListenPort = 51820

# NAT-Regeln: eth0 ggf. durch euer Netzwerk-Interface ersetzen (prüfen mit: ip link show)
PostUp   = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# ── Client 1: Smartphone ──────────────────────────────────────────────────────
[Peer]
# Client Public Key (auf dem Client generieren: wg genkey | tee client_private.key | wg pubkey > client_public.key)
PublicKey = CLIENT1_PUBLIC_KEY_HIER_EINTRAGEN
# VPN-IP des Clients (jeder Client bekommt eine eigene IP)
AllowedIPs = 10.0.0.2/32

# ── Client 2: Laptop ──────────────────────────────────────────────────────────
[Peer]
PublicKey = CLIENT2_PUBLIC_KEY_HIER_EINTRAGEN
AllowedIPs = 10.0.0.3/32
