# WireGuard server config for the Raspberry Pi
# Save as /etc/wireguard/wg0.conf, then: sudo chmod 600 /etc/wireguard/wg0.conf
# Needs: sudo apt install wireguard qrencode iptables
# Replace eth0 with wlan0 in both PostUp and PostDown if the Pi is on Wi-Fi
# (check with: ip route get 1.1.1.1 -> the name after "dev").
# If your home network already uses 10.0.0.x, pick another tunnel network (e.g. 10.8.0.1/24)
# and change the addresses in all configs to match.

[Interface]
Address = 10.0.0.1/24
ListenPort = 51820
PrivateKey = SERVER_PRIVATE_KEY
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# phone
PublicKey = PHONE_PUBLIC_KEY
AllowedIPs = 10.0.0.2/32

# Second device: remove the leading "#" from the next four lines once you have
# generated the laptop's keys, then: sudo systemctl restart wg-quick@wg0
