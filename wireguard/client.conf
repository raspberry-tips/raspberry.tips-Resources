# WireGuard client config (phone, laptop, ...)
# Save on the Pi as /etc/wireguard/clients/phone.conf and show it as a QR code:
#   sudo qrencode -t ansiutf8 -r /etc/wireguard/clients/phone.conf
# Address must match the AllowedIPs line of this device's [Peer] section in wg0.conf.
# DNS: your router's IP (FRITZ!Box: usually 192.168.178.1) or your Pi-hole's IP,
#      so names from your home network resolve. 1.1.1.1 works, but home names won't.
# Linux clients using wg-quick need resolvconf for the DNS line: sudo apt install openresolv

[Interface]
PrivateKey = PHONE_PRIVATE_KEY
Address = 10.0.0.2/32
DNS = 192.168.178.1

[Peer]
PublicKey = SERVER_PUBLIC_KEY
Endpoint = yourname.duckdns.org:51820
# Full tunnel: all traffic goes through the VPN (::/0 keeps IPv6 from bypassing it).
AllowedIPs = 0.0.0.0/0, ::/0
# Split tunnel instead: only the tunnel and your home network go through the VPN.
#AllowedIPs = 10.0.0.0/24, 192.168.178.0/24
# Optional: keep the connection open (costs a little battery, usually not needed).
#PersistentKeepalive = 25
