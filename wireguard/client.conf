# WireGuard Client-Konfiguration (Smartphone / PC)
# Tutorial: https://raspberry.tips/raspberrypi-tutorials/wireguard-vpn-server-auf-dem-raspberry-pi-einrichten
# QR-Code generieren: sudo qrencode -t ansiutf8 < client.conf

[Interface]
# Client Private Key
PrivateKey = CLIENT_PRIVATE_KEY_HIER_EINTRAGEN
# VPN-IP des Clients
Address = 10.0.0.2/24
# DNS-Server (1.1.1.1 oder IP des Pi wenn Pi-hole läuft)
DNS = 1.1.1.1

[Peer]
# Server Public Key
PublicKey = SERVER_PUBLIC_KEY_HIER_EINTRAGEN
# DDNS-Adresse oder öffentliche IP des Heimnetzwerks + Port
Endpoint = DEINE-DDNS-ADRESSE.duckdns.org:51820
# Gesamten Traffic durch VPN leiten (0.0.0.0/0) oder nur Heimnetz (z.B. 10.0.0.0/24, 192.168.1.0/24)
AllowedIPs = 0.0.0.0/0, ::/0
# Wichtig für Smartphones hinter NAT: hält Verbindung aktiv
PersistentKeepalive = 25
