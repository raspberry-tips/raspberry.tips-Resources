# WireGuard client config for a second device (laptop)
# Save on the Pi as /etc/wireguard/clients/laptop.conf.
# Same as client.conf, only with the laptop's private key and the address 10.0.0.3.
# Matching [Peer] section in wg0.conf: PublicKey = LAPTOP_PUBLIC_KEY, AllowedIPs = 10.0.0.3/32
# Linux laptop: save it there as /etc/wireguard/wg0.conf, needs: sudo apt install wireguard openresolv

[Interface]
PrivateKey = LAPTOP_PRIVATE_KEY
Address = 10.0.0.3/32
DNS = 192.168.178.1

[Peer]
PublicKey = SERVER_PUBLIC_KEY
Endpoint = yourname.duckdns.org:51820
AllowedIPs = 0.0.0.0/0, ::/0
