# Battery sensor: BME280 on a Seeed XIAO ESP32-C3 with LiPo and deep sleep
# Tutorial: https://raspberry.tips/en/raspberrypi-tutorials/esphome-raspberry-pi-smart-home-sensors
# German:   https://raspberry.tips/raspberrypi-tutorials/esphome-raspberry-pi-sensoren
# English entity names; the German versions are one folder up.
#
# Board in the ESPHome Device Builder: "Seeed XIAO ESP32C3".
# I2C on the pads D4 (SDA = GPIO6) and D5 (SCL = GPIO7) as in Seeed's pinout,
# BME280 VCC to 3V3, GND to GND. 6-pin modules only: also CSB to 3V3 and
# SDO to GND (address 0x76). Validated with "esphome config" (ESPHome 2026.10.2).
#
# The device wakes up every 10 minutes, measures, sends and sleeps again.
# Keep deep_sleep in the config from the first USB flash on. Once the device
# sleeps, it only accepts OTA updates during its short wake windows, so
# flashing without deep_sleep first just means flashing it a second time.
# While it sleeps, the Device Builder queues an update and installs it when
# the device wakes up. If that fails, flash over USB (hold BOOT while
# plugging in).
#
# secrets.yaml needs: wifi_ssid, wifi_password, api_key, fallback_password

esphome:
  name: bedroom
  friendly_name: Bedroom

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:   # require encrypted OTA updates (uses the API key above)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Bedroom Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

sensor:
  - platform: bme280_i2c
    temperature:
      name: "Temperature"
      oversampling: 16x
    pressure:
      name: "Pressure"
    humidity:
      name: "Humidity"
    address: 0x76
    update_interval: 60s   # first reading within about 5 s of waking up, well inside run_duration

deep_sleep:
  run_duration: 10s
  sleep_duration: 10min
