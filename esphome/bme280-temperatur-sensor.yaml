esphome:
  name: wohnzimmer-sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: bme280_i2c
    temperature:
      name: "Wohnzimmer Temperatur"
      oversampling: 16x
    pressure:
      name: "Wohnzimmer Luftdruck"
    humidity:
      name: "Wohnzimmer Luftfeuchtigkeit"
    address: 0x76
    update_interval: 60s
