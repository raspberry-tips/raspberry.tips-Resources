# Pi-hole Docker Compose (Pi-hole v6)
# Tutorial: https://raspberry.tips/raspberrypi-tutorials/pi-hole-einrichten-raspberry-pi

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: Europe/Berlin
      # Pi-hole v6: WEBPASSWORD (v5) is ignored and a random password is set instead
      FTLCONF_webserver_api_password: "set-a-secure-password"
      # Required with Docker's default bridge network, otherwise LAN clients get no answers
      FTLCONF_dns_listeningMode: "ALL"
      # Upstream DNS (optional)
      # FTLCONF_dns_upstreams: "1.1.1.1;9.9.9.9"
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
    restart: unless-stopped
    cap_add:
      # Only needed if Pi-hole should act as DHCP server
      - NET_ADMIN
