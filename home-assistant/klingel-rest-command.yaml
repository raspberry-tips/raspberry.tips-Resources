#   authentication: digest
#   username: admin
#   password: !secret shelly_wd_password
#
# Oberflaeche neu starten, wenn sich das Dashboard aufgehaengt hat:
# wd_neustart:
#   url: 'http://192.168.x.x/rpc/Sys.RestartApplication'
#   authentication: digest
#   username: admin
#   password: !secret shelly_wd_password
#
# Kamera im Vollbild oeffnen - Parameter noch unbekannt. Ruf die Methode
# einmal ohne Argumente auf, dann nennt das Geraet in der Fehlerantwort das
# fehlende Argument. Ui.ListAvailable und Ui.GetConfig zeigen, welche
# Quellen auf dem Display konfiguriert sind.
