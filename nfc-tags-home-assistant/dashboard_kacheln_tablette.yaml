type: vertical-stack
cards:
  - type: tile
    entity: input_boolean.tablette_nehmen
    name: Tablette nehmen – offen
    icon: mdi:pill
    color: red
    state_content: last_changed
    tap_action:
      action: none
    visibility:
      - condition: state
        entity: input_boolean.tablette_nehmen
        state: "on"
  - type: tile
    entity: input_datetime.tablette_zuletzt_genommen
    name: Tablette zuletzt genommen
    icon: mdi:pill-multiple
    tap_action:
      action: none
